[project]
name = "prakruti-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<4.1.0",
    "pyjwt>=2.9.0",
    "email-validator>=2.2.0",
    "resend>=2.43.0",
    "pgvector>=0.5.0",
    "httpx>=0.28.1",
]

[tool.uv]
package = false
dev-dependencies = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
